name: GitHub Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    name: Build ZIP and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        env:
          PLUGIN_SLUG: elasticpress-french-addon
        run: |
          mkdir -p "/tmp/${PLUGIN_SLUG}"
          rsync -a --exclude-from=.distignore ./ "/tmp/${PLUGIN_SLUG}/"
          (
            cd /tmp
            zip -r "${GITHUB_WORKSPACE}/${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}"
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: elasticpress-french-addon.zip
          generate_release_notes: true
